[pytest]
# Configuración de pytest para SIGOT
# Este archivo configura pytest-django para usar los settings de Django

DJANGO_SETTINGS_MODULE = sigot.boot.settings

# Opciones de pytest
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados (opcional, para organizar tests)
markers =
    unit: Pruebas unitarias del núcleo (core)
    integration: Pruebas de integración con base de datos
    api: Pruebas de API E2E
    slow: Pruebas que tardan mucho tiempo
    asyncio: Pruebas asíncronas que requieren event loop

asyncio_mode = auto

# Opciones de pytest-django
addopts =
    --strict-markers
    --tb=short
    --reuse-db
    -v

# Directorios donde pytest buscará tests
testpaths = sigot

